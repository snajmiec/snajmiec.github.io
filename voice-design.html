<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Design Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="sub-page">
    <h2 class="sub-title">Voice Design Portfolio</h2>

    <div class="video-grid">

      <!-- Przykładowy embed z YouTube -->
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/QeQh4Dg78a4"

          allowfullscreen>

          src="https://www.youtube.com/embed/XUuRL5-rstQ"

          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

          allowfullscreen>
        </iframe>

    </div>

    <div class="back-button-wrapper">
      <a href="index.html" class="back-button">← Return</a>
    </div>
